<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ScoreForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%8E%BC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ===================== Library screen ===================== -->
<div id="screen-library" class="screen">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#119070;</span>
      <span class="brand-name">ScoreForge</span>
    </div>
    <button id="btn-import" class="btn ghost" title="Import a score file">Import</button>
  </header>
  <div class="library-hint">Unlimited scores &middot; every instrument free &middot; works offline</div>
  <div id="score-list" class="score-list"></div>
  <button id="btn-new-score" class="fab" title="New score">+</button>
</div>

<!-- ===================== Editor screen ===================== -->
<div id="screen-editor" class="screen hidden">
  <header class="topbar editor-topbar">
    <button id="btn-back" class="iconbtn" title="Back to library">&#8592;</button>
    <div id="editor-title" class="editor-title" title="Score settings">Untitled</div>
    <div class="playgroup">
      <button id="btn-tempo" class="btn ghost small" title="Tempo">&#9833;=120</button>
      <button id="btn-play" class="iconbtn play" title="Play">&#9654;</button>
    </div>
    <button id="btn-menu" class="iconbtn" title="Menu">&#8942;</button>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="tgroup" id="dur-group">
      <button class="tbtn" data-dur="w" title="Whole note">&#119133;</button>
      <button class="tbtn" data-dur="h" title="Half note">&#119134;</button>
      <button class="tbtn active" data-dur="q" title="Quarter note">&#119135;</button>
      <button class="tbtn" data-dur="8" title="Eighth note">&#119136;</button>
      <button class="tbtn" data-dur="16" title="Sixteenth note">&#119137;</button>
      <button class="tbtn" data-dur="32" title="Thirty-second note">&#119138;</button>
      <button class="tbtn" id="btn-dot" title="Dotted note">&#119149;</button>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="btn-flat" title="Flat">&#9837;</button>
      <button class="tbtn" id="btn-natural" title="Natural">&#9838;</button>
      <button class="tbtn" id="btn-sharp" title="Sharp">&#9839;</button>
      <button class="tbtn" id="btn-tie" title="Tie to next note">&#8255;</button>
    </div>
    <div class="tgroup">
      <button class="tbtn dyn" data-dyn="p" title="Piano (soft)">p</button>
      <button class="tbtn dyn" data-dyn="mf" title="Mezzo-forte">mf</button>
      <button class="tbtn dyn" data-dyn="f" title="Forte (loud)">f</button>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="btn-rest" title="Insert rest">&#119103;</button>
      <button class="tbtn" id="btn-erase" title="Delete note">&#10005;</button>
      <button class="tbtn" id="btn-chord" title="Chord mode: add notes to the selected note">&#9835;+</button>
    </div>
    <div class="tgroup">
      <button class="tbtn" id="btn-undo" title="Undo">&#8630;</button>
      <button class="tbtn" id="btn-redo" title="Redo">&#8631;</button>
      <button class="tbtn" id="btn-add-measure" title="Add measure">+&#119074;</button>
    </div>
  </div>

  <div id="score-scroll" class="score-scroll">
    <div id="score-canvas"></div>
  </div>

  <div class="inputbar">
    <div class="inputbar-side">
      <button class="ibtn" id="btn-prev" title="Previous note">&#9664;</button>
      <button class="ibtn" id="btn-next" title="Next note">&#9654;</button>
      <button class="ibtn" id="btn-pitch-up" title="Move note up a step">&#9650;</button>
      <button class="ibtn" id="btn-pitch-down" title="Move note down a step">&#9660;</button>
    </div>
    <div id="piano-wrap" class="piano-wrap">
      <button class="ibtn" id="btn-oct-down" title="Octave down">&#8722;8<sup>va</sup></button>
      <div id="piano" class="piano"></div>
      <button class="ibtn" id="btn-oct-up" title="Octave up">+8<sup>va</sup></button>
    </div>
    <div id="drumpads" class="drumpads hidden"></div>
    <button class="ibtn parts-btn" id="btn-parts" title="Instruments &amp; parts">&#127932; Parts</button>
  </div>
</div>

<!-- ===================== Overlays ===================== -->
<div id="overlay" class="overlay hidden">
  <div id="sheet" class="sheet"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="vendor/vexflow-bravura.js"></script>
<script src="js/instruments.js"></script>
<script src="js/model.js"></script>
<script src="js/storage.js"></script>
<script src="js/renderer.js"></script>
<script src="js/playback.js"></script>
<script src="js/musicxml.js"></script>
<script src="js/app.js"></script>
</body>
</html>
